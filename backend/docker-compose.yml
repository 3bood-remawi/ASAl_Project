services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: cosmos-emulator
    ports:
      - "8081:8081"
      - "10250-10255:10250-10255"
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 5
      # persistence makes the emulator crash, and it did not survive a restart anyway.
      # the containers are recreated on startup and seed.py puts the users back.
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "false"
      # without this the emulator hands out its container IP and nothing on the host can reach it
      AZURE_COSMOS_EMULATOR_IP_ADDRESS_OVERRIDE: 127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8081/_explorer/emulator.pem >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 60s
